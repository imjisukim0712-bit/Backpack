<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOLATILE v0.2 — 가방 속에서 시간이 흐른다</title>
<style>
:root{
  --bg:#151917; --surface:#1E2421; --surface-2:#252C28; --surface-3:#2C3430;
  --ink:#E4E8E3; --muted:#98A39C; --line:#2E3733; --line-strong:#3E4944;
  --accent:#E9653A; --accent-ink:#151917;
  --heat:#E9653A; --cold:#5FA8E8; --wet:#3DB8A0; --press:#A98BE0;
  --heat-bg:#3A231B; --cold-bg:#1B2B3A; --wet-bg:#17332E; --press-bg:#2A2238;
  --ok:#5FBF87; --warn:#D9A83A; --bad:#E85A5A;
  --cell:#1A1F1C; --cell-line:#3A433E; --cell-scorch:#3A2A22; --cell-soak:#1B3A3A; --cell-hole:#0A0C0B;
  --cs: clamp(44px, 11vw, 72px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5;word-break:keep-all;overflow-x:hidden}
button{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover:not(:disabled){background:var(--surface-3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--accent)}
button.small{padding:4px 8px;min-height:36px;font-size:12px}
#btn-pred.on{background:var(--warn);color:#111;border-color:var(--warn)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--muted)}
.hidden{display:none!important}
.screen{min-height:100%;display:none;flex-direction:column}
.screen.active{display:flex}
.center{max-width:720px;margin:0 auto;padding:24px 16px;width:100%}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h1{font-size:clamp(36px,8vw,64px);letter-spacing:.04em;color:var(--accent)}
h2{font-size:20px}
h3{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
p{margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line-strong);background:var(--surface-2)}
.c-heat{color:var(--heat)} .c-cold{color:var(--cold)} .c-wet{color:var(--wet)} .c-press{color:var(--press)}
.b-heat{background:var(--heat)} .b-cold{background:var(--cold)} .b-wet{background:var(--wet)} .b-press{background:var(--press)}

/* ===== battle layout ===== */
#battle{padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));gap:8px}
.topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.hpbar{display:flex;align-items:center;gap:8px;min-width:160px}
.bar{flex:1;height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .3s}
.envgauge{display:flex;gap:10px;align-items:center;font-size:12px}
.envgauge .g{display:flex;align-items:center;gap:4px}
.envgauge .g b{display:inline-block;min-width:18px;text-align:center;border-radius:4px;padding:0 4px;color:#111}
.battle-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:8px;flex:1;align-content:start;align-items:start}
@media (max-width:900px){.battle-main{grid-template-columns:1fr}}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.right{display:flex;flex-direction:column;gap:8px;min-width:0}

/* enemies */
.enemies{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:110px}
.enemy{position:relative;background:var(--surface);border:2px solid var(--line-strong);border-radius:12px;padding:10px 12px;min-width:150px;flex:1;max-width:240px;cursor:default;transition:border-color .15s,transform .15s}
.enemy.targetable{cursor:pointer;border-color:var(--accent);box-shadow:0 0 0 2px rgba(233,101,58,.25)}
.enemy.targetable:hover{transform:translateY(-2px)}
.enemy.dead{opacity:.25;pointer-events:none}
.enemy .name{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.enemy .intent{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.enemy .intent b{color:var(--warn)}
.enemy .status{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.enemy .status span{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-strong)}
.enemy .envtag{position:absolute;top:-10px;right:10px;font-size:11px;padding:1px 8px;border-radius:999px;color:#111;font-weight:700}
.enemy.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dmgpop{position:fixed;transform:translateX(-50%);font-weight:800;font-size:18px;color:var(--bad);pointer-events:none;animation:pop .8s forwards}
@keyframes pop{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-30px)}}

/* bag grid */
.bagwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.bag{position:relative;display:grid;gap:3px;background:var(--surface);padding:6px;border:1px solid var(--line);border-radius:12px;touch-action:manipulation;user-select:none}
.cell{width:var(--cs);height:var(--cs);background:var(--cell);border:1px solid var(--cell-line);border-radius:6px;position:relative;cursor:pointer}
.cell.scorched{background:repeating-linear-gradient(135deg,var(--cell-scorch) 0 4px,var(--cell) 4px 8px)}
.cell.soaked{background:var(--cell-soak);border-color:var(--wet)}
.cell.scorched.soaked{background:repeating-linear-gradient(135deg,var(--cell-scorch) 0 4px,var(--cell-soak) 4px 8px);border-color:var(--wet)}
.cell.hole{background:var(--cell-hole);border-style:dashed;cursor:not-allowed}
.cell.hole::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--line-strong);font-size:20px}
.cell.acid{box-shadow:inset 0 0 0 2px var(--press)}
.cell.can-drop{background:rgba(95,191,135,.18);border-color:var(--ok)}
.cell.cant-drop{background:rgba(232,90,90,.18);border-color:var(--bad)}
.cell.will-scorch{box-shadow:inset 0 0 0 3px var(--heat)}
.cell.will-soak{box-shadow:inset 0 0 0 3px var(--wet)}
.cell.will-hole{box-shadow:inset 0 0 0 3px var(--bad)}
.cell.radius{background:rgba(233,101,58,.22)}
.cell.target-ok{background:rgba(233,101,58,.3);border-color:var(--heat)}
.item{position:absolute;border-radius:7px;border:2px solid var(--line-strong);background:var(--surface-2);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;cursor:pointer;z-index:2;transition:box-shadow .15s;overflow:hidden;font-size:12px;line-height:1.2}
.item:hover{box-shadow:0 0 0 2px var(--ink)}
.item.selected{box-shadow:0 0 0 3px var(--accent);z-index:3}
.item.will-change{outline:3px dashed var(--warn);outline-offset:-3px}
.item.will-vanish{outline:3px dashed var(--bad);outline-offset:-3px}
.item.ghost{opacity:.55;pointer-events:none;z-index:4;border-style:dashed}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tk{position:absolute;right:3px;bottom:2px;font-weight:800;font-size:13px;font-family:ui-monospace,monospace}
.item .emit{position:absolute;left:4px;bottom:3px;font-size:10px;display:flex;gap:2px}
.item .emit i{display:inline-block;width:8px;height:8px;border-radius:50%}
.item .inner{position:absolute;left:3px;bottom:15px;right:3px;font-size:9px;background:rgba(0,0,0,.55);border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:2px}
.item.k-source{border-style:double;border-width:4px} .item.k-container{border-style:dashed} .item.k-tool{border-style:dotted}
.item.k-catalyst{border-color:gold} .item.k-drop{border-color:var(--muted)}
.item.cd{filter:saturate(.3)}
.item.blocked{opacity:.75}

/* action bar */
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.ap{display:flex;gap:4px;margin-right:6px}
.ap i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;border:1px solid var(--line-strong)}
.ap i.used{background:var(--surface-3)}
.hint{font-size:12px;color:var(--muted);text-align:center;min-height:18px;padding:0 8px}

/* right panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}
.panel h3{margin-bottom:6px}
.log{max-height:220px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px}
.log div{padding:2px 4px;border-left:3px solid var(--line-strong);background:var(--surface-2);border-radius:3px}
.log div.heat{border-color:var(--heat)} .log div.cold{border-color:var(--cold)} .log div.wet{border-color:var(--wet)} .log div.press{border-color:var(--press)}
.log div.dmg{border-color:var(--bad)} .log div.turn{border-color:var(--warn);color:var(--warn);font-weight:700} .log div.ok{border-color:var(--ok)}
.info .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.info .kv b{color:var(--muted);font-weight:500}
.states{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.states div{padding:3px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.states div.cur{border-color:var(--accent)}
@media (max-width:900px){.log{max-height:140px}}
@media (max-width:600px){.item{padding:3px 4px}.enemy{min-width:120px;padding:8px 10px}.enemy .name{font-size:13px}}

/* map */
.map{display:flex;flex-direction:column;gap:14px;align-items:center}
.maprow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.node{padding:10px 14px;border-radius:10px;border:2px solid var(--line-strong);background:var(--surface);min-width:120px;text-align:center;cursor:default;opacity:.55}
.node.avail{opacity:1;cursor:pointer;border-color:var(--accent)}
.node.avail:hover{background:var(--surface-3)}
.node.done{opacity:.9;border-color:var(--ok);background:var(--surface-2)}
.node small{display:block;color:var(--muted);font-size:11px}

/* inventory list / camp */
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.li.sel{border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choices button{text-align:left;padding:10px 12px}
.choices button b{display:block}
.choices button small{color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;justify-content:center}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend .lh::before{background:var(--heat)} .legend .lc::before{background:var(--cold)} .legend .lw::before{background:var(--wet)} .legend .lp::before{background:var(--press)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-strong);padding:8px 14px;border-radius:8px;z-index:60;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
table.tbl{border-collapse:collapse;width:100%;font-size:12px}
table.tbl td,table.tbl th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}

/* sprites */
.spr{display:inline-block;line-height:0;vertical-align:middle;width:24px;height:24px;flex:none}
.spr svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.item .art{position:absolute;left:0;right:0;top:11px;bottom:8px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.item .art .spr{width:calc(var(--cs) * .84);height:calc(var(--cs) * .84);max-width:100%;max-height:100%}
.item .art .spr.stretch{width:55%;height:100%}
.item.i-divider .art{top:4px;bottom:4px}
.item.i-leadbox .art .spr{width:calc(var(--cs) * 1.5);height:calc(var(--cs) * 1.5)}
.item .nm{position:absolute;top:2px;left:4px;right:4px;font-size:10px;line-height:1.1}
.item .st{position:absolute;top:13px;left:4px;right:4px;font-size:9px}
.item.multi .art{top:0}
.enemy .name .espr{width:44px;height:44px;margin:-6px -2px -6px 0}
.enemy.boss .name .espr{width:56px;height:56px}
.hpbar .spr{width:30px;height:30px;margin-right:2px}
.mini{position:relative;display:grid;gap:2px;background:var(--surface);padding:5px;border:1px solid var(--line);border-radius:10px;margin:0 auto 10px;width:max-content}
.mini .cell{width:34px;height:34px;cursor:default}
.mini .mi{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;border:1px solid var(--line-strong);border-radius:5px;background:rgba(255,255,255,.03)}
.mini .mi .spr{width:24px;height:24px}
.title-art{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.title-art .spr{width:36px;height:36px}
.title-art .spr.hero{width:84px;height:84px}
.li .spr{width:26px;height:26px;margin-right:6px}
.choices button .spr{width:28px;height:28px;margin-right:6px}
@media (max-width:600px){.item .nm{display:none}.item .st{top:2px;left:3px;right:auto;background:rgba(0,0,0,.45);padding:0 3px;border-radius:3px;z-index:1}.item .art{top:3px;bottom:3px}.item .art .spr{width:calc(var(--cs) * .9);height:calc(var(--cs) * .9)}.enemy .name .espr{width:36px;height:36px}}
</style>
</head>
<body>
<!-- ===== 타이틀 ===== -->
<section id="title" class="screen active">
  <div class="center" style="text-align:center;padding-top:8vh">
    <div class="muted mono" style="letter-spacing:.14em">TURN-BASED INVENTORY ROGUELIKE · PROTOTYPE v0.2</div>
    <h1>VOLATILE</h1>
    <p style="font-size:16px;margin-bottom:20px">가방 속에서 시간이 흐른다</p>
    <p class="muted" style="max-width:520px;margin:0 auto 24px">주인공은 한 대도 못 때린다. 가방 안의 얼음이 녹고, 기름이 끓고, 화약이 젖는 동안<br>정확한 턴에 정확한 것을 던지는 것이 전투의 전부다.</p>
    <div class="title-art" id="title-art"></div>
    <div class="row" style="justify-content:center">
      <button class="primary" onclick="G.newRun()">새 런 시작</button>
      <button onclick="G.showCodex()">도감</button>
      <button onclick="G.showHelp()">규칙 설명</button>
    </div>
    <div class="legend" style="margin-top:28px"><span class="lh">열 HEAT</span><span class="lc">냉 COLD</span><span class="lw">습 WET</span><span class="lp">압 PRESSURE</span></div>
  </div>
</section>

<!-- ===== 노드맵 ===== -->
<section id="map" class="screen">
  <div class="center">
    <div class="topbar" style="margin-bottom:14px"><div id="map-status"></div><div class="row"><button class="small" onclick="G.showBag()">가방 보기</button><button class="small" onclick="G.showCodex()">도감</button></div></div>
    <h2 id="map-title"></h2>
    <p class="muted">다음 방을 고르세요. 층의 끝에는 캠프가 있습니다.</p>
    <div id="map-nodes" class="map"></div>
  </div>
</section>

<!-- ===== 전투 ===== -->
<section id="battle" class="screen">
  <div class="topbar">
    <div class="hpbar"><span id="hero-spr"></span><b>HP</b><div class="bar"><i id="hp-fill"></i></div><span id="hp-text" class="mono"></span></div>
    <div id="turn-text" class="mono muted"></div>
    <button class="small" onclick="G.giveUp()">런 포기</button>
    <div class="envgauge" id="env-gauge"></div>
  </div>
  <div class="battle-main">
    <div class="left">
      <div class="enemies" id="enemies"></div>
      <div class="hint" id="hint"></div>
      <div class="bagwrap"><div class="bag" id="bag"></div></div>
      <div class="actions" id="actionbar">
        <div class="ap" id="ap"></div>
        <button class="small" id="btn-rot" onclick="G.rotateSel()">회전 (R)</button>
        <button class="small" id="btn-swap" onclick="G.swapMode()">교환 (2)</button>
        <button class="small" id="btn-use" onclick="G.useSel()">사용</button>
        <button class="small" id="btn-cont" onclick="G.containerMode()">덮기/꺼내기</button>
        <button class="small" id="btn-cancel" onclick="G.cancelSel()">선택 해제</button>
        <button class="small" id="btn-pred" onclick="G.togglePredict()">예측 보기</button>
        <button class="primary" id="btn-end" onclick="G.endTurn()" onmouseenter="G.previewTick(true)" onmouseleave="G.previewTick(false)">턴 종료</button>
      </div>
    </div>
    <div class="right">
      <div class="panel info" id="info"><h3>아이템 정보</h3><div class="muted">아이템을 선택하면 상태와 전이 규칙이 표시됩니다.</div></div>
      <div class="panel"><h3>반응 로그</h3><div class="log" id="log"></div></div>
    </div>
  </div>
</section>

<!-- ===== 캠프 / 채집 / 이벤트 / 가방 / 도감 / 결과 ===== -->
<section id="camp" class="screen"><div class="center" id="camp-body"></div></section>
<section id="generic" class="screen"><div class="center" id="generic-body"></div></section>

<div id="pop-layer" style="position:fixed;inset:0;pointer-events:none;z-index:40"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   VOLATILE v0.2 — 단일 파일 프로토타입
   구조: DATA(아이템/적/레시피/이벤트) → Solver(순수 함수 반응 틱)
         → Battle(턴 상태 기계) → Run(층/맵/캠프/이벤트) → UI(렌더)
   ===================================================================== */
const PROPS = ['heat','cold','wet','press'];
const PROP_KO = {heat:'열', cold:'냉', wet:'습', press:'압'};
const KIND_KO = {source:'발산원', reactant:'반응물', container:'용기', tool:'도구', catalyst:'촉매', drop:'드롭', consumable:'소모품', material:'재료'};

/* ---------- 아이템 정의 ----------
   states[0]이 초기 상태. tr: 전이 [{p:속성, t:임계치, n:다음상태}]
   emit: 발산. life: 발산 n틱 뒤 소멸(-1 영구). enter: 진입 시 즉시 효과.
   throw: 던지기 효과. { kind, ... } */
const ITEMS = {
  torch:{name:'횃불', w:1,h:2, kind:'source', states:[
    {id:'lit', name:'점화', emit:{heat:1}, tr:[{p:'wet',t:2,n:'out'}], throw:{kind:'burn', n:1, t:2, dmgType:'heat', desc:'화상 1×2'}},
    {id:'out', name:'꺼짐', tr:[{p:'heat',t:2,n:'lit'}], throw:{kind:'dmg', n:1, dmgType:'phys', desc:'1 피해'}} ]},
  ice:{name:'얼음주머니', w:1,h:1, kind:'reactant', states:[

const SpriteCache=new Map();
function spriteSVG(rows, opts={}){
  const key=(opts.key||rows.join('|'))+(opts.stretch?'#s':'');
  if(SpriteCache.has(key)) return SpriteCache.get(key);
  const n=rows.length; let out='';
  rows.forEach((r,y)=>{ let x=0; while(x<r.length){ const ch=r[x]; if(ch==='.'){x++;continue;} let w=1; while(x+w<r.length&&r[x+w]===ch) w++; out+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${PALETTE[ch]||'#f0f'}"/>`; x+=w; } });
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"${opts.stretch?' preserveAspectRatio="none"':''}>${out}</svg>`;
  SpriteCache.set(key,svg); return svg;
}
function itemSpriteRows(id, st){
  let rows=ITEM_SPRITES[`${id}:${st}`];
  if(!rows){ const k=Object.keys(ITEM_SPRITES).find(k=>k.startsWith(id+':')); rows=ITEM_SPRITES[k]; }
  return rows||['k'];
}
function itemSprite(id, st, size, extra=''){ const rows=itemSpriteRows(id,st); const stretch=(id==='divider'); const sz=size?`width:${size}px;height:${size}px;`:''; return `<span class="spr${stretch?' stretch':''}" style="${sz}${extra}">${spriteSVG(rows,{key:`${id}:${st}`,stretch})}</span>`; }
function enemySprite(id, size){ const rows=(typeof ENEMY_SPRITES!=='undefined'&&ENEMY_SPRITES[id])||['k']; const sz=size?`width:${size}px;height:${size}px;`:''; return `<span class="spr" style="${sz}">${spriteSVG(rows,{key:'enemy:'+id})}</span>`; }
function playerSprite(size){ return `<span class="spr" style="width:${size}px;height:${size}px">${spriteSVG(PLAYER_SPRITE,{key:'player'})}</span>`; }

<script>
/* =====================================================================
   BagState + ReactionSolver — 씬(UI)을 모르는 순수 함수.
   예측 오버레이와 실제 턴 처리가 같은 tick()을 쓴다.
   ===================================================================== */
let UID = 1;
function mkItem(id, st){
  const d = ITEMS[id];
  const s = st ? d.states.find(x=>x.id===st) : d.states[0];
  return {uid:UID++, id, x:0, y:0, rot:false, st:s.id, c:{heat:0,cold:0,wet:0,press:0}, life:(s.life ?? -1), cool:0, contents:[], boost:false};
}
function idef(it){ return ITEMS[it.id]; }
function sdef(it){ return idef(it).states.find(s=>s.id===it.st); }
function dims(it){ const d=idef(it); return it.rot ? {w:d.h,h:d.w} : {w:d.w,h:d.h}; }
function itemCells(it, x=it.x, y=it.y, rot=it.rot){
  const d=idef(it); const w=rot?d.h:d.w, h=rot?d.w:d.h; const out=[];
  for(let j=0;j<h;j++) for(let i=0;i<w;i++) out.push([x+i,y+j]);
  return out;
}
/* 칸: hole(구멍) · sc(그을림, 영구) · soak(젖음 남은 턴) · acid(산성 누적) — 그을림과 젖음은 겹칠 수 있다 */
function mkCell(){ return {hole:false, sc:false, soak:0, acid:0}; }
function mkBag(cols=5, rows=4){
  const cells=[]; for(let i=0;i<cols*rows;i++) cells.push(mkCell());
  return {cols, rows, cells, items:[], blast:[]};
}
function cidx(bag,x,y){ return y*bag.cols+x; }
function inBag(bag,x,y){ return x>=0&&y>=0&&x<bag.cols&&y<bag.rows; }
function cloneBag(bag){ return JSON.parse(JSON.stringify(bag)); }
function occMap(bag, ignoreUid){
  const m = new Map();
  for(const it of bag.items){ if(it.uid===ignoreUid) continue; for(const [x,y] of itemCells(it)) m.set(cidx(bag,x,y), it); }
  return m;
}
function canPlace(bag, it, x, y, rot){
  const occ = occMap(bag, it.uid);
  for(const [cx,cy] of itemCells(it,x,y,rot)){
    if(!inBag(bag,cx,cy)) return false;
    if(bag.cells[cidx(bag,cx,cy)].hole) return false;
    if(occ.has(cidx(bag,cx,cy))) return false;
  }
  return true;
}
function findSpot(bag, it){
  for(const rot of [false,true]) for(let y=0;y<bag.rows;y++) for(let x=0;x<bag.cols;x++) if(canPlace(bag,it,x,y,rot)) return {x,y,rot};
  return null;
}
function addItem(bag, it){ const s=findSpot(bag,it); if(!s) return false; it.x=s.x; it.y=s.y; it.rot=s.rot; bag.items.push(it); return true; }
function neighbors(bag, it){
  const occ = occMap(bag, it.uid); const seen=new Set(); const out=[];
  for(const [x,y] of itemCells(it)) for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx, ny=y+dy; if(!inBag(bag,nx,ny)) continue;
    const nb = occ.get(cidx(bag,nx,ny)); if(nb && !seen.has(nb.uid)){ seen.add(nb.uid); out.push(nb); }
  }
  return out;
}
function emitOf(it){
  const s=sdef(it); const e={heat:0,cold:0,wet:0,press:0};
  if(s.emit) for(const k in s.emit) e[k]+=s.emit[k];
  if(it.boost && e.heat>0) e.heat+=1;   // 풀무
  return e;
}
/* 아이템 하나의 이번 틱 노출 계산 (가방 최상위 아이템 기준) */
function exposure(bag, it, env){
  const d=idef(it);
  if(d.kind==='container'){
    if(d.lead) return {heat:0,cold:0,wet:0,press:0};
    let p=0; for(const c of it.contents) p+=emitOf(c).press; return {heat:0,cold:0,wet:0,press:p};
  }
  const e={heat:env.heat||0, cold:env.cold||0, wet:env.wet||0, press:0};
  let mul=1, add=0;
  for(const nb of neighbors(bag,it)){
    const nd=idef(nb);
    if(nd.heatMul) mul*=nd.heatMul;
    if(nd.heatAdd) add+=nd.heatAdd;
    const em=emitOf(nb); for(const k of PROPS) e[k]+=em[k];
  }
  for(const b of bag.blast){ for(const [x,y] of itemCells(it)) if(b.cells.includes(cidx(bag,x,y))){ e.heat+=b.heat; break; } }
  e.heat = e.heat*mul + (e.heat>0||add>0 ? add : 0);
  let soaked=false;
  for(const [x,y] of itemCells(it)){ const c=bag.cells[cidx(bag,x,y)]; if(c.sc) e.heat+=1; if(c.soak>0) soaked=true; }
  if(soaked) e.heat=0;
  e.wet=Math.max(0,e.wet);
  const nh=Math.max(0,e.heat-e.cold), nc=Math.max(0,e.cold-e.heat);
  return {heat:nh, cold:nc, wet:e.wet, press:e.press, rawHeat:e.heat, rawCold:e.cold};
}
/* 다음 전이까지 남은 틱 (표시용) */
function ticksLeft(bag, it, env, ex){
  const s=sdef(it); if(!ex) ex=exposure(bag,it,env);
  let best=null;
  for(const tr of (s.tr||[])){
    const rate=ex[tr.p]||0; if(rate<=0) continue;
    const n=Math.ceil((tr.t-it.c[tr.p])/rate);
    if(best===null||n<best.n) best={n:Math.max(1,n), p:tr.p, to:tr.n};
  }
  if(best===null && it.life>0){ const em=emitOf(it); const p=PROPS.find(k=>em[k]>0)||'heat'; best={n:it.life, p, to:s.lifeTo||'vanish'}; }
  return best;
}
function stateName(id, sid){ const s=ITEMS[id].states.find(x=>x.id===sid); return s?s.name:(sid==='vanish'?'소멸':sid); }

/* ---------- 틱 (순수 함수: 씬·랜덤·저장소를 모른다) ---------- */
const Solver = {
  tick(bag, env){
    const r={events:[], codex:[], playerDmg:0, scorch:[], soak:[], holes:[], vanished:[], changed:[], aoe:[]};
    const next=cloneBag(bag);
    // 1) 노출은 '현재' 가방 기준으로 먼저 전부 계산. 용기 내용물은 외부 차단(노출 0), 납 상자 내용물은 시간 정지
    const ex={}; const ticking=[];
    for(const it of bag.items){ ex[it.uid]=exposure(bag,it,env); }
    for(const it of next.items){ ticking.push({it, parent:null}); const d=idef(it); if(d.kind==='container'&&!d.lead) for(const c of it.contents){ ex[c.uid]={heat:0,cold:0,wet:0,press:0}; ticking.push({it:c, parent:it}); } }
    // 2) 카운터 갱신 + 전이 판정
    const enters=[];
    for(const {it,parent} of ticking){
      const e=ex[it.uid]; const d=idef(it);
      it.boost=false;
      if(d.kind==='container' && d.lead) continue;
      it.c.heat+=e.heat; it.c.cold+=e.cold; it.c.wet+=e.wet; it.c.press+=e.press;
      const s=sdef(it);
      let moved=false;
      for(const tr of (s.tr||[])){
        if(it.c[tr.p]>=tr.t){
          r.events.push({text:`${d.name}: ${s.name} → ${stateName(it.id,tr.n)} (${PROP_KO[tr.p]} ${it.c[tr.p]}/${tr.t})`, cls:tr.p});
          r.codex.push({key:`${it.id}:${s.id}>${tr.n}`, text:`${d.name}: ${s.name} + ${PROP_KO[tr.p]} ${tr.t} → ${stateName(it.id,tr.n)}`});
          it.st=tr.n; it.c={heat:0,cold:0,wet:0,press:0}; const ns=sdef(it); it.life=(ns.life ?? -1);
          if(ns.enter) enters.push({it, fx:ns.enter, parent}); if(ns.vanish && !ns.enter) r.vanished.push(it.uid);
          r.changed.push(it.uid); moved=true; break;
        }
      }
      if(!moved && it.life>0){
        it.life--;
        if(it.life===0){
          if(s.lifeTo){ r.events.push({text:`${d.name}: ${s.name} → ${stateName(it.id,s.lifeTo)}`, cls:'heat'}); r.codex.push({key:`${it.id}:${s.id}>${s.lifeTo}`, text:`${d.name}: ${s.name} ${s.life}틱 → ${stateName(it.id,s.lifeTo)}`}); it.st=s.lifeTo; it.c={heat:0,cold:0,wet:0,press:0}; const ns=sdef(it); if(ns.enter) enters.push({it,fx:ns.enter,parent}); }
          else { r.events.push({text:`${d.name}(${s.name}) 소멸`, cls:'turn'}); r.vanished.push(it.uid); }
          r.changed.push(it.uid);
        }
      }
    }
    // 3) on_enter 효과 일괄 적용. 여기서 생긴 발산(blast)은 다음 틱부터 노출에 포함
    next.blast=[];
    for(const {it,fx,parent} of enters){ if(parent){ r.vanished.push(it.uid); r.events.push({text:`${idef(it).name}이(가) ${idef(parent).name} 안에서 ${sdef(it).name}`, cls:'press'}); continue; } for(const f of fx) Solver.enter(next, it, f, r); }
    // 4) 소멸 정리
    Solver.purge(next, r);
    // 5) 칸 타이머: 젖음 감소(이번 틱에 새로 젖은 칸 제외), 산성 누적
    next.cells.forEach((c,i)=>{ if(c.soak>0 && !r.soak.includes(i)) c.soak--; });
    for(const it of next.items){ if(sdef(it).acid){ for(const [x,y] of itemCells(it)) for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(!inBag(next,nx,ny)) continue; const c=next.cells[cidx(next,nx,ny)]; if(c.hole) continue; c.acid++; if(c.acid>=3){ Solver.makeHole(next, nx, ny, r); r.events.push({text:`산성 증기: (${nx+1},${ny+1}) 칸에 구멍`, cls:'press'}); } } } }
    Solver.purge(next, r);
    r.bag=next; return r;
  },
  purge(bag, r){ bag.items = bag.items.filter(it=>!r.vanished.includes(it.uid)); for(const it of bag.items) it.contents = it.contents.filter(c=>!r.vanished.includes(c.uid)); },
  cells33(bag, it){ const out=new Set(); for(const [x,y] of itemCells(it)) for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const nx=x+dx,ny=y+dy; if(inBag(bag,nx,ny)) out.add(cidx(bag,nx,ny)); } return [...out]; },
  cellsCross(bag, it){ const out=new Set(); for(const [x,y] of itemCells(it)) for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(inBag(bag,nx,ny)) out.add(cidx(bag,nx,ny)); } return [...out]; },
  cellsAdj(bag, it){ const own=new Set(itemCells(it).map(([x,y])=>cidx(bag,x,y))); const out=new Set(); for(const [x,y] of itemCells(it)) for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(inBag(bag,nx,ny)&&!own.has(cidx(bag,nx,ny))) out.add(cidx(bag,nx,ny)); } return [...out]; },
  makeHole(bag, x, y, r){ const i=cidx(bag,x,y); bag.cells[i]={hole:true, sc:false, soak:0, acid:0}; r.holes.push(i); for(const it of bag.items){ if(itemCells(it).some(([cx,cy])=>cx===x&&cy===y) && !r.vanished.includes(it.uid)){ r.vanished.push(it.uid); r.events.push({text:`${idef(it).name} 파괴 (구멍)`, cls:'dmg'}); } } },
  soakCells(bag, cells, r){ for(const i of cells){ const c=bag.cells[i]; if(c.hole) continue; c.soak=2; r.soak.push(i); } },
  enter(bag, it, f, r){
    const d=idef(it);
    if(f==='explode33' || f==='explode33s'){
      const heat = f==='explode33'?6:3, pdmg = f==='explode33'?3:1;
      const cells=Solver.cells33(bag,it);
      bag.blast.push({cells, heat});
      if(f==='explode33') for(const i of cells){ if(!bag.cells[i].hole && !bag.cells[i].sc){ bag.cells[i].sc=true; r.scorch.push(i); } }
      r.playerDmg+=pdmg; r.vanished.push(it.uid);
      r.events.push({text:`${d.name} 폭발! 3×3 열 ${heat}${f==='explode33'?' · 칸 그을림':''} · 플레이어 ${pdmg} 피해`, cls:'dmg'});
    } else if(f==='explodeCross'){
      const cells=Solver.cellsCross(bag,it); r.vanished.push(it.uid);
      for(const i of cells){ const x=i%bag.cols, y=Math.floor(i/bag.cols); Solver.makeHole(bag,x,y,r); }
      r.playerDmg+=5; r.events.push({text:`${d.name} 폭발! 십자 칸 구멍 · 플레이어 5 피해`, cls:'dmg'});
    } else if(f==='soak'){
      Solver.soakCells(bag, Solver.cellsAdj(bag,it), r);
      r.events.push({text:`${d.name}: 증기가 인접 칸을 적심 (2턴)`, cls:'wet'});
    } else if(f==='burst'){
      r.vanished.push(it.uid); r.playerDmg+=2;
      const c=it.contents[0]; if(c){ r.vanished.push(c.uid); const cs=sdef(c); if(cs.throw) r.aoe.push({fx:cs.throw, item:{id:c.id, st:c.st}}); }
      r.events.push({text:`${d.name} 파열! 파편 · 플레이어 2 피해${c?` · ${idef(c).name}(${sdef(c).name}) 효과가 적 전체에 퍼짐`:''}`, cls:'press'});
    }
  }
};
</script>
<script>
/* ---------- 도감 (localStorage) ---------- */
const Codex = {
  data:{transitions:{}, recipes:{}},
  load(){ try{ const s=localStorage.getItem('volatile_codex'); if(s) this.data=JSON.parse(s); }catch(e){} },
  save(){ try{ localStorage.setItem('volatile_codex', JSON.stringify(this.data)); }catch(e){} },
  seen(key, text){ if(!this.data.transitions[key]){ this.data.transitions[key]=text; this.save(); } },
  recipe(key, text){ if(!this.data.recipes[key]){ this.data.recipes[key]=text; this.save(); } },
};
Codex.load();

/* ---------- 유틸 ---------- */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const $ = id => document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- 런 상태 ---------- */
const Run = {
  hp:30, maxHp:30, floor:1, bag:null, map:null, pos:0, tailorUsed:false, forcedNext:null, stats:{turns:0, moves:0, throws:0, waits:0, previews:0},
  matsCount(){ return this.bag.items.filter(it=>sdef(it).material).length; },
};
function startingBag(){
  // 기획서 5장의 교육용 배치: 횃불이 기름을 달구지만 얼음이 상쇄한다. 얼음을 옮길 것인가.
  const bag=mkBag(5,4);
  const list=[['torch',0,0,false],['oil',1,0,false],['ice',2,0,false],['water',2,2,false],['divider',3,0,false],['jar',4,0,false],['bandage',4,1,false],['salt',4,2,false],['mushroom',4,3,false]];
  for(const [id,x,y,rot] of list){ const it=mkItem(id); if(canPlace(bag,it,x,y,rot)){ it.x=x; it.y=y; it.rot=rot; bag.items.push(it); } else addItem(bag,it); }
  // 화약은 유리병 안에 넣어 시작한다 (환경 열 +1이면 밖에서 바로 터진다)
  bag.items.find(i=>i.id==='jar').contents.push(mkItem('powder'));
  return bag;
}

/* ---------- 전투 ---------- */
const Battle = {
  active:false, busy:false, enemies:[], turn:0, ap:2, sel:null, mode:'idle', env:{heat:0,cold:0,wet:0}, log:[], breathTurn:false, stolen:[], pendingLoot:[],
  start(ids, opts={}){
    this.active=true; this.busy=false; this.enemies=ids.map((id,i)=>{ const d=ENEMIES[id]; return {uid:i, id, hp:d.hp, maxHp:d.hp, armor:d.armor||0, st:{}, dead:false}; });
    this.turn=0; this.log=[]; this.stolen=[]; this.breathTurn=false; this.isElite=!!opts.elite; this.isBoss=!!opts.boss;
    Run.bag.blast=[]; for(const it of Run.bag.items){ it.cool=0; it.boost=false; }
    this.newTurn();
  },
  addLog(text, cls=''){ this.log.push({text,cls}); if(this.log.length>80) this.log.shift(); },
  alive(){ return this.enemies.filter(e=>!e.dead); },
  computeEnv(){
    const env={heat:0,cold:0,wet:0};
    for(const e of this.alive()){ if(e.st.freeze) continue; const d=ENEMIES[e.id]; if(d.env) for(const k in d.env) env[k]+=d.env[k]; if(d.boss){ env.heat+=this.turn; } }
    const boss=this.alive().find(e=>ENEMIES[e.id].boss); if(boss && boss.hp<=20) env.cold=0;   // 페이즈 2: 냉 환경 무시
    this.env=env; return env;
  },
  newTurn(){
    this.turn++; Run.stats.turns++; this.ap=2; this.sel=null; this.mode='idle'; this.computeEnv();
    for(const it of Run.bag.items) if(it.cool>0) it.cool--;
    this.addLog(`— ${this.turn}턴 —`, 'turn');
    const boss=this.alive().find(e=>ENEMIES[e.id].boss);
    this.breathTurn = !!(boss && this.turn%3===0);
    if(this.breathTurn) this.addLog('용광로 지킴이가 숨을 들이쉰다… 화염 숨결 8 예고. 물·얼음을 던지면 취소.', 'dmg');
    UI.renderBattle();
  },
  spend(n=1){ this.ap-=n; UI.renderBattle(); },
  canAct(){ return this.active && !this.busy; },
  /* --- 플레이어 행동 --- */
  moveSel(x,y){
    const it=this.sel; if(!it||!this.canAct()) return;
    if(!Run.bag.items.includes(it)) return;
    if(!canPlace(Run.bag,it,x,y,it.rot)) { toast('놓을 수 없는 자리'); return; }
    if(it.x===x&&it.y===y) return;
    if(this.ap<1){ toast('행동이 없습니다'); return; }
    it.x=x; it.y=y; Run.stats.moves++; this.addLog(`${idef(it).name} 이동`, 'ok'); this.spend(1);
  },
  rotateSel(){
    const it=this.sel; if(!it||!this.canAct()||!Run.bag.items.includes(it)) return; const d=idef(it); if(d.w===d.h){ toast('회전할 필요가 없는 아이템'); return; }
    if(this.ap<1){ toast('행동이 없습니다'); return; }
    if(!canPlace(Run.bag,it,it.x,it.y,!it.rot)){ toast('회전할 공간이 없습니다'); return; }
    it.rot=!it.rot; Run.stats.moves++; this.addLog(`${idef(it).name} 회전`, 'ok'); this.spend(1);
  },
  swapMode(){
    const it=this.sel; if(!it||!this.canAct()||!Run.bag.items.includes(it)) return;
    if(this.ap<2){ toast('자리 교환은 행동 2가 필요합니다'); return; }
    this.mode='swap'; UI.renderBattle(); UI.hint('자리를 바꿀 다른 아이템을 클릭하세요 (행동 2)');
  },
  swapWith(other){
    const it=this.sel; this.mode='idle'; if(other===it||!Run.bag.items.includes(other)){ UI.renderBattle(); return; }
    const bag=Run.bag; const rest=bag.items.filter(x=>x!==it&&x!==other);
    const tmp={cols:bag.cols, rows:bag.rows, cells:bag.cells, items:rest, blast:[]};
    const a={...it, x:other.x, y:other.y}, b={...other, x:it.x, y:it.y};
    const fitsA=canPlace(tmp,a,a.x,a.y,a.rot); if(fitsA) tmp.items.push(a); const fitsB=fitsA&&canPlace(tmp,b,b.x,b.y,b.rot);
    if(!fitsA||!fitsB){ toast('두 아이템의 크기가 맞지 않아 교환할 수 없습니다'); UI.renderBattle(); return; }
    const ox=it.x, oy=it.y; it.x=other.x; it.y=other.y; other.x=ox; other.y=oy; Run.stats.moves+=2;
    this.addLog(`${idef(it).name} ↔ ${idef(other).name} 자리 교환`, 'ok'); this.spend(2);
  },
  useSel(){
    const it=this.sel; if(!it||!this.canAct()) return; const s=sdef(it); const d=idef(it);
    if(!Run.bag.items.includes(it)){ toast('용기 안의 아이템은 먼저 꺼내야 합니다'); return; }
    if(!s.use){ toast('사용할 수 없는 아이템'); return; }
    if(this.ap<1){ toast('행동이 없습니다'); return; }
    if(it.cool>0){ toast(`쿨타임 ${it.cool}턴`); return; }
    if(s.use.kind==='heal'){ Run.hp=Math.min(Run.maxHp, Run.hp+s.use.n); this.addLog(`붕대 사용: HP +${s.use.n}`, 'ok'); Run.bag.items=Run.bag.items.filter(x=>x!==it); this.sel=null; this.spend(1); return; }
    if(s.use.kind==='flint'){ this.mode='flint'; UI.renderBattle(); UI.hint('부싯돌: 인접한 아이템을 클릭하면 열 2를 가합니다'); return; }
    if(s.use.kind==='bellows'){ const nbs=neighbors(Run.bag,it).filter(n=>emitOf(n).heat>0); if(!nbs.length){ toast('인접한 열 발산원이 없습니다'); return; } for(const n of nbs) n.boost=true; it.cool=d.cool; this.addLog(`풀무: ${nbs.map(n=>idef(n).name).join(', ')} 열 +1 (이번 틱)`, 'heat'); this.spend(1); return; }
  },
  flintTarget(target){
    const it=this.sel; if(!neighbors(Run.bag,it).includes(target)){ toast('인접한 아이템만 가능'); return; }
    this.mode='idle'; it.cool=idef(it).cool;
    const s=sdef(target); target.c.heat+=2; let txt=`부싯돌: ${idef(target).name}에 열 2`;
    for(const tr of (s.tr||[])){ if(tr.p==='heat' && target.c.heat>=tr.t){ txt+=` → ${stateName(target.id,tr.n)}`; Codex.seen(`${target.id}:${s.id}>${tr.n}`, `${idef(target).name}: ${s.name} + 열 ${tr.t} → ${stateName(target.id,tr.n)}`); target.st=tr.n; target.c={heat:0,cold:0,wet:0,press:0}; const ns=sdef(target); target.life=(ns.life??-1);
      if(ns.enter){ const r={events:[],codex:[],playerDmg:0,scorch:[],soak:[],holes:[],vanished:[],changed:[],aoe:[]}; Run.bag.blast=[]; for(const f of ns.enter) Solver.enter(Run.bag,target,f,r); Solver.purge(Run.bag,r); this.applyTickResult(r); }
      else if(ns.vanish) Run.bag.items=Run.bag.items.filter(x=>x!==target);
      break; } }
    this.addLog(txt,'heat'); this.spend(1);
    if(Run.hp<=0) this.checkEnd();
  },
  /* 덮기/꺼내기 */
  containerMode(){
    const it=this.sel; if(!it||!this.canAct()) return;
    const owner=Run.bag.items.find(c=>c.contents.includes(it));
    if(owner){ // 꺼내기
      if(this.ap<1){ toast('행동이 없습니다'); return; }
      owner.contents=owner.contents.filter(x=>x!==it);
      if(!addItem(Run.bag,it)){ owner.contents.push(it); toast('가방에 빈 자리가 없습니다'); return; }
      this.addLog(`${idef(it).name}을(를) ${idef(owner).name}에서 꺼냄`, 'ok'); this.sel=it; this.spend(1); return;
    }
    if(idef(it).kind==='container'){ toast('용기 자체는 넣을 수 없습니다. 넣을 아이템을 선택하세요'); return; }
    const d=idef(it); if(d.w*d.h>2 || d.kind==='tool' || d.kind==='catalyst'){ toast('넣을 수 없는 아이템'); return; }
    this.mode='cover'; UI.renderBattle(); UI.hint('넣을 용기(유리병·납 상자)를 클릭하세요. 유리병은 1×1만 들어갑니다');
  },
  coverInto(cont){
    const it=this.sel; const cd=idef(cont); const d=idef(it);
    if(cd.kind!=='container'){ toast('용기가 아닙니다'); return; }
    const size=d.w*d.h; const used=cont.contents.reduce((a,c)=>a+idef(c).w*idef(c).h,0);
    if(cd.id==='jar' && size>1){ toast('유리병에는 1×1만'); return; }
    if(used+size>cd.cap){ toast('용기가 가득 찼습니다'); return; }
    if(this.ap<1){ toast('행동이 없습니다'); return; }
    Run.bag.items=Run.bag.items.filter(x=>x!==it); cont.contents.push(it); this.mode='idle'; this.sel=cont;
    this.addLog(`${d.name}을(를) ${cd.name}에 넣음`, 'ok'); this.spend(1);
  },
  /* --- 던지기 --- */
  canThrow(it){ if(!it||!this.canAct()||this.mode!=='idle'||this.ap<1) return false; if(!Run.bag.items.includes(it)) return false; const d=idef(it); return !(d.kind==='tool'||d.kind==='catalyst'||d.lead); },
  throwAt(enemy){
    const it=this.sel; if(!this.canThrow(it)||enemy.dead) return; const d=idef(it); const s=sdef(it);
    let fx=s.throw||{kind:'dmg',n:1,dmgType:'phys',desc:'1 피해'};
    if(fx.brink){ const tl=ticksLeft(Run.bag,it,this.env); if(tl&&tl.p==='heat'&&tl.n===1) fx=fx.brink; }
    if(d.id==='jar'){ const c=it.contents[0]; if(c){ const cs=sdef(c); const cfx=cs.throw||{kind:'dmg',n:1,dmgType:'phys'}; this.applyThrow(enemy, cfx, {id:c.id,st:c.st}); } this.applyThrow(enemy,{kind:'dmg',n:2,dmgType:'phys',desc:'파편 2'}, {id:'jar',st:'jar'}); }
    else this.applyThrow(enemy, fx, {id:it.id, st:it.st});
    Run.bag.items=Run.bag.items.filter(x=>x!==it); Run.stats.throws++; this.sel=null; this.mode='idle'; this.spend(1);
    this.checkEnd();
  },
  applyThrow(enemy, fx, src, wide){
    const nm=ITEMS[src.id].name+(stateName(src.id,src.st)!==ITEMS[src.id].name?`(${stateName(src.id,src.st)})`:'');
    const targets = (fx.kind==='aoe'||wide) ? this.alive() : [enemy];
    let text=`${nm} ${wide?'효과':'투척'} → ${wide?'적 전체':ENEMIES[enemy.id].name}: `;
    let parts=[];
    for(const t of targets){
      const td=ENEMIES[t.id];
      if(fx.kind==='dmg'||fx.kind==='aoe'||fx.kind==='water'||fx.kind==='acid'||fx.kind==='oiled'){
        let n=fx.n||0; let type=fx.dmgType||'phys';
        if(fx.vs && td.slime) n=fx.vs.slime;
        if(fx.kind==='water'){ n = td.fire ? fx.n : 0; if(t.st.burn){ delete t.st.burn; parts.push('화상 해제'); } if(td.boss && this.breathTurn){ this.breathTurn=false; parts.push('화염 숨결 취소!'); } }
        if(fx.kind==='acid'){ if(t.armor>0){ t.armor=0; parts.push('방어 제거'); } n=fx.n; type='acid'; }
        if(n>0) parts.push(this.dealDamage(t, n, type));
        if(fx.kind==='oiled'){ t.st.oiled=true; parts.push('기름 (다음 열 피해 ×2)'); }
      } else if(fx.kind==='burn'){ t.st.burn={n:fx.n,t:fx.t}; parts.push(`화상 ${fx.n}×${fx.t}`); }
      else if(fx.kind==='freeze'){ t.st.freeze=true; parts.push('동결 (1턴 행동 불가)'); if(t.st.burn){ delete t.st.burn; parts.push('화상 해제'); } if(td.boss && this.breathTurn){ this.breathTurn=false; parts.push('화염 숨결 취소!'); } if(td.fire) parts.push(this.dealDamage(t,2,'cold')); this.computeEnv(); }
      else if(fx.kind==='poison'){ t.st.poison={n:fx.n,t:fx.t}; parts.push(`중독 ${fx.n}×${fx.t}`); }
      else if(fx.kind==='plant'){ t.st.planted=true; parts.push('화약 설치 (다음 열 투척 +5, 광역 5)'); }
    }
    this.addLog(text+parts.join(' · '), fx.dmgType==='heat'||fx.dmgType==='explode'?'heat':(fx.dmgType==='cold'||fx.dmgType==='water'?'cold':'dmg'));
  },
  dealDamage(t, n, type, opts={}){
    const td=ENEMIES[t.id]; let bonus='';
    const heatLike = type==='heat'||type==='explode';
    if(heatLike && t.st.planted && !opts.dot){ delete t.st.planted; n+=5; bonus+=' +화약 5'; for(const o of this.alive()) if(o!==t){ o.hp-=5; UI.pop(o,5); if(o.hp<=0) this.kill(o); } bonus+=' (광역 5)'; }
    if(heatLike && t.st.oiled){ n*=2; delete t.st.oiled; bonus+=' (기름 ×2)'; }
    if(td.fire && (type==='water'||type==='cold')){ n*=2; bonus+=' (약점 ×2)'; }
    if(td.wraith){ if(heatLike){ n*=2; bonus+=' (약점 ×2)'; } else { n=Math.ceil(n/2); bonus+=' (½)'; } }
    if(t.armor>0 && type!=='poison'){ if(type==='explode'){ t.armor=0; bonus+=' 방어 파괴'; } else { const before=n; n=Math.max(0,n-t.armor); bonus+=` (방어 ${t.armor}: ${before}→${n})`; } }
    t.hp-=n; UI.pop(t,n); if(t.hp<=0) this.kill(t);
    return `${n} 피해${bonus}`;
  },
  kill(t){
    if(t.dead) return; t.dead=true; t.hp=0; const td=ENEMIES[t.id];
    this.addLog(`${td.name} 처치`, 'ok');
    if(td.special==='slime'){ const j=mkItem('jelly'); if(addItem(Run.bag,j)) this.addLog('슬라임이 가방 빈 칸에 젤리를 남겼다', 'wet'); }
    if(td.special==='goblin' && this.stolen.length){ for(const it of this.stolen){ if(!addItem(Run.bag,it)) this.pendingLoot.push(it); } this.addLog(`고블린이 훔친 것을 돌려줬다 (${this.stolen.map(i=>idef(i).name).join(', ')})`, 'ok'); this.stolen=[]; }
    if(td.drop){ const n=td.dropN||1; for(let i=0;i<n;i++) this.pendingLoot.push(mkItem(td.drop)); }
    this.computeEnv();
  },
  damagePlayer(n){ if(n<=0) return; Run.hp-=n; UI.flash(); },
  applyTickResult(r){
    for(const e of r.events) this.addLog(e.text, e.cls);
    for(const c of r.codex) Codex.seen(c.key, c.text);
    if(r.playerDmg>0){ this.damagePlayer(r.playerDmg); this.addLog(`가방 안 폭발로 ${r.playerDmg} 피해`, 'dmg'); }
    for(const a of r.aoe){ const first=this.alive()[0]; if(first) this.applyThrow(first, a.fx, a.item, true); }
  },
  /* --- 턴 종료: 반응 틱 → 적 행동 → 판정 --- */
  endTurn(){
    if(!this.canAct()) return; this.busy=true;
    this.waitBonus=this.ap*2; if(this.ap>0) Run.stats.waits++; this.ap=0;
    this.sel=null; this.mode='idle'; UI.hover=null;
    const r=Solver.tick(Run.bag, this.env);
    Run.bag=r.bag; this.applyTickResult(r);
    UI.renderBattle();
    if(this.checkEnd()) return;
    setTimeout(()=>{ this.enemyPhase(); }, 350);
  },
  enemyPhase(){
    let pool=this.waitBonus;   // 대기 보너스: 이번 턴 받는 피해 총량에서 차감
    for(const e of this.alive()){
      const d=ENEMIES[e.id];
      if(e.st.burn){ this.addLog(`${d.name} 화상: ${this.dealDamage(e,e.st.burn.n,'heat',{dot:true})}`, 'heat'); if(e.st.burn){ e.st.burn.t--; if(e.st.burn.t<=0) delete e.st.burn; } if(e.dead) continue; }
      if(e.st.poison){ this.addLog(`${d.name} 중독: ${this.dealDamage(e,e.st.poison.n,'poison',{dot:true})}`, 'wet'); if(e.st.poison){ e.st.poison.t--; if(e.st.poison.t<=0) delete e.st.poison; } if(e.dead) continue; }
      if(e.st.freeze){ delete e.st.freeze; this.addLog(`${d.name}은(는) 얼어서 움직이지 못했다`, 'cold'); continue; }
      let atk=d.atk;
      if(d.boss && this.breathTurn){ atk=8; this.addLog('화염 숨결!', 'dmg'); }
      const cut=Math.min(pool, atk); pool-=cut; const dmg=atk-cut;
      this.damagePlayer(dmg); this.addLog(`${d.name} 공격 ${atk}${cut?` (대기 -${cut})`:''} → ${dmg} 피해`, 'dmg');
      if(d.special==='rat' && this.turn%3===0){ const v=Run.bag.items.filter(i=>i.id==='bandage'||i.id==='mushroom'); if(v.length){ const t=pick(v); Run.bag.items=Run.bag.items.filter(i=>i!==t); this.addLog(`쥐가 ${idef(t).name}을(를) 갉아 파괴했다`, 'dmg'); } }
      if(d.special==='goblin' && this.turn%2===0){ const v=Run.bag.items.filter(i=>!(idef(i).kind==='container'&&i.contents.length)); if(v.length){ const t=pick(v); Run.bag.items=Run.bag.items.filter(i=>i!==t); this.stolen.push(t); this.addLog(`고블린이 ${idef(t).name}을(를) 훔쳤다!`, 'dmg'); } }
      if(d.boss && e.hp<=20){ const c=Run.bag.cells.filter(c=>!c.hole&&!c.sc); if(c.length){ pick(c).sc=true; this.addLog('지킴이의 열기가 가방 한 칸을 그을렸다 (페이즈 2)', 'heat'); } }
    }
    this.waitBonus=0; this.busy=false;
    if(!this.checkEnd()) this.newTurn();
  },
  checkEnd(){
    if(Run.hp<=0){ Run.hp=0; this.active=false; this.busy=false; UI.renderBattle(); setTimeout(()=>Screens.gameOver(), 400); return true; }
    if(this.alive().length===0){ this.active=false; this.busy=false; UI.renderBattle(); setTimeout(()=>Screens.victory(), 400); return true; }
    return false;
  },
};

<script>

<script>
/* =====================================================================
   Screens — 맵 / 전투 결과 / 캠프 / 이벤트 / 채집 / 도감 / 도움말
   ===================================================================== */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id)); window.scrollTo(0,0); }
function modal(html){ $('modal-root').innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`; }
function closeModal(){ $('modal-root').innerHTML=''; }
function itemLine(it){ const d=idef(it), s=sdef(it); return `${itemSprite(it.id,it.st,26)}${d.name}${s.name!==d.name?` <span class="muted">(${s.name})</span>`:''} <span class="muted mono" style="font-size:11px">${d.w}×${d.h}</span>`; }
function miniBag(bag){
  let h=`<div class="mini" style="grid-template-columns:repeat(${bag.cols},34px)">`;
  for(let y=0;y<bag.rows;y++) for(let x=0;x<bag.cols;x++){ const c=bag.cells[cidx(bag,x,y)]; h+=`<div class="cell${c.hole?' hole':''}${c.sc?' scorched':''}${c.soak>0?' soaked':''}"></div>`; }
  for(const it of bag.items){ const dm=dims(it); h+=`<div class="mi" style="left:${5+it.x*36}px;top:${5+it.y*36}px;width:${dm.w*36-2}px;height:${dm.h*36-2}px" title="${idef(it).name} · ${sdef(it).name}">${itemSprite(it.id,it.st)}</div>`; }
  return h+'</div>';
}
const NODE_KO={battle:'전투', elite:'정예 전투', gather:'채집', event:'이벤트', camp:'캠프', boss:'보스'};
function genFloor(f){
  const steps=[]; const roll=()=>{ const r=Math.random(); return r<.55?'battle':r<.65?'elite':r<.80?'gather':'event'; };
  steps.push([{t:'battle'}]);
  for(let i=1;i<=3;i++){ let a=roll(), b=roll(); if(a===b&&a!=='battle') b='battle'; steps.push([{t:a},{t:b}]); }
  steps.push([{t:'elite'}]); steps.push([{t:'camp'}]);
  return {steps, step:0};
}
const Screens = {
  map(){
    show('map'); const m=Run.map; $('map-title').textContent=`${Run.floor}층 — 노드맵`;
    $('map-status').innerHTML=`<b>HP ${Run.hp}/${Run.maxHp}</b> · 가방 ${Run.bag.cols}×${Run.bag.rows} · 아이템 ${Run.bag.items.length}개 · 재료 ${Run.matsCount()}`;
    const el=$('map-nodes'); el.innerHTML='';
    m.steps.forEach((row,si)=>{ const r=document.createElement('div'); r.className='maprow'; row.forEach((n,ni)=>{ const d=document.createElement('div'); d.className='node'+(si===m.step?' avail':'')+(si<m.step&&n.done?' done':''); d.innerHTML=`<b>${NODE_KO[n.t]}</b><small>${si+1}/${m.steps.length}</small>`; if(si===m.step) d.onclick=()=>Screens.enter(n); r.appendChild(d); }); el.appendChild(r); if(si<m.steps.length-1){ const a=document.createElement('div'); a.className='muted'; a.textContent='▼'; el.appendChild(a); } });
  },
  enter(n){
    n.done=true; Run.map.step++;
    if(n.t==='battle'||n.t==='elite'){ let ids; if(Run.forcedNext){ ids=Run.forcedNext; Run.forcedNext=null; } else ids=pick(ENCOUNTERS[Run.floor][n.t==='elite'?'elite':'normal']); Battle.pendingLoot=[]; Battle.lastNode=n.t; show('battle'); Battle.start(ids.slice(),{elite:n.t==='elite'}); }
    else if(n.t==='gather') Screens.gather();
    else if(n.t==='event') Screens.event();
    else if(n.t==='camp') Screens.camp();
  },
  victory(){
    Run.stats.battles=(Run.stats.battles||0)+1;
    if(Battle.isBoss){ Screens.win(); return; }
    const loot=Battle.pendingLoot.slice(); Battle.pendingLoot=[];
    const elite=Battle.lastNode==='elite';
    let offers; if(elite){ const pool=['jar','divider','flint','bellows','leadbox']; const a=pool.splice(rnd(pool.length),1)[0]; offers=[[a],[pick(pool)]]; } else offers=[[pick(['ice','oil','water'])],[pick(['powder','salt','mushroom'])],[pick(['ice','oil','bandage','powder'])]];
    Screens.loot('전투 승리', loot, offers, elite?'정예 보상: 비소모 아이템 2중 1':'채집: 반응물 3중 1', ()=>Screens.map());
  },
  loot(title, drops, offers, offerTitle, next){
    show('generic'); const body=$('generic-body'); let chosen=null; const taken=new Set();
    const render=()=>{
      body.innerHTML=`<h2>${title}</h2>${miniBag(Run.bag)}<div class="card"><h3>드롭</h3>${drops.length?'<div class="list">'+drops.map((it,i)=>`<div class="li"><span>${itemLine(it)}</span>${taken.has(i)?'<span class="c-ok muted">가방에 넣음</span>':`<button class="small" data-i="${i}">가방에 넣기</button>`}</div>`).join('')+'</div>':'<div class="muted">없음</div>'}</div>
      ${offers?`<div class="card"><h3>${offerTitle}</h3><div class="choices">${offers.map((o,i)=>`<button data-o="${i}" ${chosen!==null?'disabled':''}>${o.map(id=>`<b style="display:flex;align-items:center">${itemSprite(id,ITEMS[id].states[0].id,28)}${ITEMS[id].name}</b>`).join('')}<small>${o.map(id=>ITEMS[id].w+'×'+ITEMS[id].h+' · '+(KIND_KO[ITEMS[id].kind]||'')).join(', ')}</small></button>`).join('')}</div>${chosen!==null?'<div class="c-ok" style="margin-top:6px">선택 완료</div>':''}</div>`:''}
      <div class="row"><button class="primary" id="go-next">계속</button><span class="muted">가방에 자리가 없으면 넣을 수 없습니다. 넣지 않은 아이템은 버려집니다.</span></div>`;
      body.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(addItem(Run.bag,drops[i])){ taken.add(i); } else toast('가방에 빈 자리가 없습니다'); render(); });
      body.querySelectorAll('button[data-o]').forEach(b=>b.onclick=()=>{ const o=offers[+b.dataset.o]; let okAll=true; for(const id of o){ if(!addItem(Run.bag,mkItem(id))) okAll=false; } chosen=+b.dataset.o; if(!okAll) toast('일부 아이템은 자리가 없어 버려졌습니다'); render(); });
      $('go-next').onclick=next;
    }; render();
  },
  gather(){
    const a=[pick(['ice','oil','water']),pick(['powder','salt','mushroom'])], b=[pick(['ice','water','oil']),pick(['bandage','salt','mushroom'])], t=[pick(['flint','bellows','divider','jar'])];
    Screens.loot('채집', [], [a,b,t], '반응물 2개 또는 도구 1개', ()=>Screens.map());
  },
  event(){
    const evs=EVENTS.filter(e=>!(e.id==='tailor'&&Run.tailorUsed)); const ev=pick(evs);
    show('generic'); const body=$('generic-body');
    body.innerHTML=`<h2>${ev.title}</h2>${miniBag(Run.bag)}<div class="card"><p>${ev.text}</p><div class="choices">${ev.choices.map((c,i)=>`<button data-c="${i}" ${c.need&&!Run.bag.items.some(it=>it.id===c.need)?'disabled':''}><b>${c.label}</b>${c.sub?`<small>${c.sub}</small>`:''}</button>`).join('')}</div></div>`;
    body.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>Screens.eventAct(ev, ev.choices[+b.dataset.c]));
  },
  eventAct(ev, c){
    $('generic-body').innerHTML=`<h2>${ev.title}</h2>`;
    const lines=[];
    if(c.act==='furnace'){ let env={heat:2,cold:0,wet:0}; for(let i=0;i<2;i++){ const r=Solver.tick(Run.bag,env); Run.bag=r.bag; for(const e of r.events) lines.push(e.text); if(r.playerDmg){ Run.hp-=r.playerDmg; lines.push(`폭발로 ${r.playerDmg} 피해`); } } for(let i=0;i<2;i++){ const it=mkItem(pick(['batwing','jelly','frost'])); lines.push(addItem(Run.bag,it)?`${idef(it).name} 획득`:`${idef(it).name}은 자리가 없어 버려짐`); } if(Run.hp<=0){ Run.hp=0; Screens.gameOver(); return; } }
    else if(c.act==='freezeOne'){ const w=Run.bag.items.find(it=>it.st==='water'); if(w){ w.st='ice'; w.c={heat:0,cold:0,wet:0,press:0}; lines.push(`${idef(w).name}이(가) 얼음이 되었다`); } else lines.push('얼릴 물이 없었다'); }
    else if(c.act==='soakAll'){ for(const it of Run.bag.items) it.c.heat=0; for(const cell of Run.bag.cells) if(!cell.hole){ cell.soak=2; } for(let i=0;i<2;i++){ const it=mkItem('bandage'); lines.push(addItem(Run.bag,it)?'붕대 획득':'붕대는 자리가 없어 버려짐'); } lines.push('모든 열 카운터 초기화 · 가방 전체 2턴 젖음'); }
    else if(c.act==='tailor'){ const b=Run.bag.items.find(it=>it.id==='bandage'); Run.bag.items=Run.bag.items.filter(it=>it!==b); Run.bag.rows++; for(let i=0;i<Run.bag.cols;i++) Run.bag.cells.push(mkCell()); Run.tailorUsed=true; lines.push(`가방이 ${Run.bag.cols}×${Run.bag.rows}로 넓어졌다`); }
    else if(c.act==='merchant'){ const it=mkItem('ember'); lines.push(addItem(Run.bag,it)?'잉걸 촉매 획득':'촉매는 자리가 없어 버려짐'); const r={events:[],playerDmg:0,scorch:[],soak:[],holes:[],vanished:[]}; const normal=Run.bag.cells.map((c,i)=>i).filter(i=>!Run.bag.cells[i].hole); for(let k=0;k<2&&normal.length;k++){ const i=normal.splice(rnd(normal.length),1)[0]; Solver.makeHole(Run.bag,i%Run.bag.cols,Math.floor(i/Run.bag.cols),r); } Run.bag.items=Run.bag.items.filter(it=>!r.vanished.includes(it.uid)); lines.push('가방 칸 2개가 구멍이 났다'); for(const e of r.events) lines.push(e.text); }
    else if(c.act==='thief'){ for(let i=0;i<2;i++){ const it=mkItem('jar'); lines.push(addItem(Run.bag,it)?'유리병 획득':'유리병은 자리가 없어 버려짐'); } Run.forcedNext=['goblin','goblin']; lines.push('다음 전투: 고블린 ×2'); }
    else lines.push('지나쳤다.');
    modal(`<h2>${ev.title}</h2><div class="card">${lines.map(l=>`<div>${l}</div>`).join('')||'<div class="muted">아무 일도 없었다</div>'}</div>${miniBag(Run.bag)}<button class="primary" onclick="closeModal();Screens.map()">계속</button>`);
  },
  camp(){
    show('camp'); const body=$('camp-body'); let selA=null;
    const render=()=>{
      const bag=Run.bag; const mats=bag.items.filter(it=>sdef(it).material); const scor=bag.cells.filter(c=>c.sc).length, holes=bag.cells.filter(c=>c.hole).length;
      const matKey=it=>it.id==='mushroom'?'mushroom:dried':it.id;
      const canCraft=RECIPES.filter(r=>{ const ks=mats.map(matKey); const i=ks.indexOf(r.a); if(i<0) return false; const rest=ks.slice(); rest.splice(i,1); return rest.includes(r.b); });
      body.innerHTML=`<h2>캠프 — ${Run.floor}층 끝</h2><p class="muted">고칠까, 만들까. 재료(날개·젤리·서리·마른 버섯)는 수선과 조합이 함께 씁니다.</p>${miniBag(bag)}
      <div class="card"><h3>수선 · 재료 ${mats.length}개</h3><div class="row"><button class="small" id="rep-s" ${scor&&mats.length>=1?'':'disabled'}>그을림 1칸 제거 (재료 1) — 남은 ${scor}</button><button class="small" id="rep-h" ${holes&&mats.length>=2?'':'disabled'}>구멍 1칸 메우기 (재료 2) — 남은 ${holes}</button></div></div>
      <div class="card"><h3>조합 (재료 2 → 반응물 1)</h3>${canCraft.length?'<div class="choices">'+canCraft.map((r,i)=>`<button data-r="${i}"><b>${r.name}</b></button>`).join('')+'</div>':'<div class="muted">지금 재료로 만들 수 있는 조합이 없습니다</div>'}<div class="muted" style="margin-top:6px;font-size:11px">레시피: ${RECIPES.map(r=>r.name).join(' / ')}</div></div>
      <div class="card"><h3>버리기</h3><div class="list">${bag.items.map((it,i)=>`<div class="li"><span>${itemLine(it)}</span><button class="small" data-d="${i}">버리기</button></div>`).join('')}</div></div>
      <button class="primary" id="camp-next">${Run.floor>=3?'보스에게 간다':'다음 층으로'}</button>`;
      const consume=(n)=>{ for(let k=0;k<n;k++){ const m=bag.items.find(it=>sdef(it).material); bag.items=bag.items.filter(it=>it!==m); } };
      $('rep-s').onclick=()=>{ const c=bag.cells.find(c=>c.sc); c.sc=false; consume(1); render(); };
      $('rep-h').onclick=()=>{ const c=bag.cells.find(c=>c.hole); c.hole=false; c.acid=0; consume(2); render(); };
      body.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{ const r=canCraft[+b.dataset.r]; const ia=bag.items.find(it=>sdef(it).material&&matKey(it)===r.a); bag.items=bag.items.filter(it=>it!==ia); const ib=bag.items.find(it=>sdef(it).material&&matKey(it)===r.b); bag.items=bag.items.filter(it=>it!==ib); const out=mkItem(r.out); if(!addItem(bag,out)) toast('자리가 없어 결과물이 버려졌습니다'); Codex.recipe(r.out, r.name); toast(`${ITEMS[r.out].name} 제작`); render(); });
      body.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{ bag.items.splice(+b.dataset.d,1); render(); });
      $('camp-next').onclick=()=>{ if(Run.floor>=3){ Battle.pendingLoot=[]; Battle.lastNode='boss'; show('battle'); Battle.start(['boss'],{boss:true}); } else { Run.floor++; Run.map=genFloor(Run.floor); Screens.map(); } };
    }; render();
  },
  statsHtml(){ const s=Run.stats; const acts=s.moves+s.throws; return `<table class="tbl"><tr><td>도달</td><td>${Run.floor<4?Run.floor+'층':'보스'}</td></tr><tr><td>총 턴</td><td>${s.turns}</td></tr><tr><td>옮기기·회전</td><td>${s.moves} (${acts?Math.round(s.moves/acts*100):0}%)</td></tr><tr><td>던지기</td><td>${s.throws}</td></tr><tr><td>대기한 턴</td><td>${s.waits}</td></tr><tr><td>예측 오버레이 사용</td><td>${s.previews}</td></tr><tr><td>가방 점유율</td><td>${Math.round(Run.bag.items.reduce((a,it)=>a+idef(it).w*idef(it).h,0)/(Run.bag.cols*Run.bag.rows)*100)}%</td></tr></table>`; },
  gameOver(){ show('generic'); $('generic-body').innerHTML=`<h2 style="color:var(--bad)">가방이 비었다… 견습 연금술사는 쓰러졌다</h2><div class="card">${Screens.statsHtml()}</div><div class="row"><button class="primary" onclick="G.newRun()">다시 시작</button><button onclick="G.title()">타이틀로</button></div>`; },
  win(){ show('generic'); const f=mkItem('phoenix'); $('generic-body').innerHTML=`<h2 style="color:var(--ok)">용광로 지킴이를 쓰러뜨렸다!</h2><p>드롭: ${itemSprite('phoenix','p',24)} 불사조 깃털 (인접 아이템 열 노출 ×2). 세로 슬라이스는 여기까지입니다.</p><div class="card">${Screens.statsHtml()}</div><div class="row"><button class="primary" onclick="G.newRun()">새 런</button><button onclick="G.title()">타이틀로</button><button onclick="G.showCodex()">도감</button></div>`; },
  codex(){ const t=Object.values(Codex.data.transitions), r=Object.values(Codex.data.recipes); modal(`<h2>도감</h2><div class="card"><h3>발견한 상태 전이 ${t.length}</h3>${t.length?t.map(x=>`<div>· ${x}</div>`).join(''):'<div class="muted">아직 없음. 전투에서 반응을 목격하면 기록됩니다.</div>'}</div><div class="card"><h3>조합 레시피 ${r.length}/${RECIPES.length}</h3>${r.length?r.map(x=>`<div>· ${x}</div>`).join(''):'<div class="muted">캠프에서 조합하면 기록됩니다.</div>'}</div><button class="primary" onclick="closeModal()">닫기</button>`); },
  help(){ modal(`<h2>규칙</h2><div class="card"><b>턴 순서</b>: 플레이어 행동 2개 → 반응 틱 → 적 행동. 남은 행동 1개당 이번 턴 받는 피해 -2.<br><b>행동</b>: 아이템 클릭 후 빈 칸 클릭 = 옮기기(1) · 적 클릭 = 던지기(1) · 회전(1) · 덮기/꺼내기(1) · 도구·붕대 사용(1).<br><b>속성</b>: <span class="c-heat">열</span> <span class="c-cold">냉</span> <span class="c-wet">습</span> <span class="c-press">압</span>. 상하좌우 인접 칸으로만 전파. 열과 냉은 서로 상쇄. 적은 살아 있는 동안 가방 전체에 환경을 더한다.<br><b>남은 틱</b>: 아이템 우하단 숫자 = 다음 상태 전이까지 남은 반응 틱. 색은 그 속성.<br><b>미리보기</b>: 아이템을 선택하고 칸 위에 마우스를 올리면 그 자리에서 받을 노출과 남은 틱을 보여준다. "턴 종료"에 마우스를 올리면 이번 틱의 결과(변할 아이템, 그을릴·젖을 칸)를 겹쳐 보여준다.<br><b>칸 상태</b>: 그을림(열 +1, 캠프 수선) · 젖음(2턴간 열 정지) · 구멍(배치 불가, 캠프 수선).<br><b>용기</b>: 유리병은 외부를 차단하고 내부 압 3에 파열. 납 상자는 시간이 멈춘다. 증기를 병에 가두면 압력 폭탄.<br><b>기름병</b>: 상온 → 달아오름 → 발화 → 폭발. 폭발 직전 틱에 던지면 광역 6. 가방 안에서 터지면 3×3 그을림 + 피해.<br><b>화약</b>: 열 1에 즉시 폭발(십자 구멍). 젖으면 안전.<br><b>단축키</b>: R 회전 · E 턴 종료 · Esc 선택 해제.</div><button class="primary" onclick="closeModal()">닫기</button>`); },
  bagView(){ modal(`<h2>가방</h2>${miniBag(Run.bag)}<div class="list">${Run.bag.items.map(it=>`<div class="li"><span>${itemLine(it)}</span><span class="muted" style="font-size:11px">${(sdef(it).throw||{}).desc||''}</span></div>`).join('')}</div><button class="primary" style="margin-top:10px" onclick="closeModal()">닫기</button>`); },
};

/* ---------- 컨트롤러 ---------- */
const G = {
  title(){ closeModal(); show('title'); },
  newRun(){ closeModal(); Run.hp=30; Run.maxHp=30; Run.floor=1; Run.bag=startingBag(); Run.map=genFloor(1); Run.tailorUsed=false; Run.forcedNext=null; Run.stats={turns:0,moves:0,throws:0,waits:0,previews:0}; Battle.active=false; Screens.map(); },
  endTurn(){ UI.predicting=false; UI.predictPinned=false; Battle.endTurn(); },
  previewTick(on){ if(!Battle.active||UI.touch||UI.predictPinned) return; if(on&&!UI.predicting) Run.stats.previews++; UI.predicting=on; UI.renderBag(); UI.predictHint(); },
  togglePredict(){ if(!Battle.active) return; UI.predictPinned=!UI.predictPinned; UI.predicting=UI.predictPinned; if(UI.predicting) Run.stats.previews++; UI.renderBattle(); UI.predictHint(); },
  swapMode(){ Battle.swapMode(); },
  rotateSel(){ Battle.rotateSel(); }, useSel(){ Battle.useSel(); }, containerMode(){ Battle.containerMode(); },
  cancelSel(){ Battle.sel=null; Battle.mode='idle'; UI.hover=null; UI.renderBattle(); },
  giveUpConfirm(){ closeModal(); Battle.active=false; Battle.busy=false; Run.hp=0; Screens.gameOver(); },
  giveUp(){ if(!Battle.active) return; modal(`<h2>런을 포기할까요?</h2><p class="muted">가방이 비어 더 이상 싸울 수 없을 때 사용합니다.</p><div class="row"><button class="primary" onclick="G.giveUpConfirm()">포기한다</button><button onclick="closeModal()">계속 싸운다</button></div>`); },
  showCodex(){ Screens.codex(); }, showHelp(){ Screens.help(); }, showBag(){ Screens.bagView(); },
};
$('title-art').innerHTML=['torch:lit','oil:lit','ice:ice','powder:dry','jar:jar'].map(k=>{ const [id,st]=k.split(':'); return itemSprite(id,st); }).join('')+`<span class="spr hero">${spriteSVG(PLAYER_SPRITE,{key:'player'})}</span>`+['water:water','salt:salt','mushroom:raw','frost:f','phoenix:p'].map(k=>{ const [id,st]=k.split(':'); return itemSprite(id,st); }).join('');
$('hero-spr').innerHTML=playerSprite(30);
document.addEventListener('keydown', e=>{ if(!Battle.active) return; if(e.key==='r'||e.key==='R') G.rotateSel(); if(e.key==='e'||e.key==='E') G.endTurn(); if(e.key==='Escape') G.cancelSel(); });
</script>
</body>
